 .box{fill:#f6f8fa;stroke:#d0d7de} .acc{fill:#8250df} .accs{stroke:#8250df}
 .ok{fill:#2da44e} .okb{fill:#dafbe1;stroke:#2da44e} .warnb{fill:#fff1e5;stroke:#f97316}
 .pc{fill:#8250df}
 @media (prefers-color-scheme: dark) {
  .bg{fill:#0d1117;stroke:#30363d} .t{fill:#e6edf3} .m{fill:#9198a1}
