  .okb{fill:#0f2e1b;stroke:#3fb950} .warnb{fill:#3a1d08;stroke:#f97316} .acc{fill:#a371f7} .accs{stroke:#a371f7} .pc{fill:#a371f7}
 }
</style><rect class="bg" x="0.5" y="0.5" width="869" height="371" rx="14"/><text class="t" x="24" y="38" font-size="20" text-anchor="start" font-weight="700">Step 1 — count before searching</text><text class="m" x="24" y="62" font-size="13.5" text-anchor="start" font-weight="400">Each square needs a known number of hits to reach the goal (small numbers). The pieces bring a known number of hits.</text><rect class="cell" x="24" y="88" width="40" height="40" rx="6"/><rect class="s2" x="35.64" y="99.64" width="16.72" height="16.72" rx="1.76"/><text class="t" x="59" y="123" font-size="12" font-weight="700" text-anchor="end">1</text><rect class="cell" x="68" y="88" width="40" height="40" rx="6"/><circle class="s0" cx="88.0" cy="108.0" r="9.24"/><text class="t" x="103" y="123" font-size="12" font-weight="700" text-anchor="end">0</text><rect class="cell" x="112" y="88" width="40" height="40" rx="6"/><rect class="s2" x="123.64" y="99.64" width="16.72" height="16.72" rx="1.76"/><text class="t" x="147" y="123" font-size="12" font-weight="700" text-anchor="end">1</text><rect class="cell" x="156" y="88" width="40" height="40" rx="6"/><circle class="s0" cx="176.0" cy="108.0" r="9.24"/><text class="t" x="191" y="123" font-size="12" font-weight="700" text-anchor="end">0</text><rect class="cell" x="24" y="132" width="40" height="40" rx="6"/><rect class="s2" x="35.64" y="143.64" width="16.72" height="16.72" rx="1.76"/><text class="t" x="59" y="167" font-size="12" font-weight="700" text-anchor="end">1</text><rect class="cell" x="68" y="132" width="40" height="40" rx="6"/><path class="s1" d="M88.0 142.1 L98.56 160.36 L77.44 160.36Z"/><text class="t" x="103" y="167" font-size="12" font-weight="700" text-anchor="end">2</text><rect class="cell" x="112" y="132" width="40" height="40" rx="6"/><path class="s1" d="M132.0 142.1 L142.56 160.36 L121.44 160.36Z"/><text class="t" x="147" y="167" font-size="12" font-weight="700" text-anchor="end">2</text><rect class="cell" x="156" y="132" width="40" height="40" rx="6"/><rect class="s2" x="167.64" y="143.64" width="16.72" height="16.72" rx="1.76"/><text class="t" x="191" y="167" font-size="12" font-weight="700" text-anchor="end">1</text><rect class="cell" x="24" y="176" width="40" height="40" rx="6"/><circle class="s0" cx="44.0" cy="196.0" r="9.24"/><text class="t" x="59" y="211" font-size="12" font-weight="700" text-anchor="end">0</text><rect class="cell" x="68" y="176" width="40" height="40" rx="6"/><circle class="s0" cx="88.0" cy="196.0" r="9.24"/><text class="t" x="103" y="211" font-size="12" font-weight="700" text-anchor="end">0</text><rect class="cell" x="112" y="176" width="40" height="40" rx="6"/><circle class="s0" cx="132.0" cy="196.0" r="9.24"/><text class="t" x="147" y="211" font-size="12" font-weight="700" text-anchor="end">0</text><rect class="cell" x="156" y="176" width="40" height="40" rx="6"/><rect class="s2" x="167.64" y="187.64" width="16.72" height="16.72" rx="1.76"/><text class="t" x="191" y="211" font-size="12" font-weight="700" text-anchor="end">1</text><rect class="cell" x="24" y="220" width="40" height="40" rx="6"/><circle class="s0" cx="44.0" cy="240.0" r="9.24"/><text class="t" x="59" y="255" font-size="12" font-weight="700" text-anchor="end">0</text><rect class="cell" x="68" y="220" width="40" height="40" rx="6"/><circle class="s0" cx="88.0" cy="240.0" r="9.24"/><text class="t" x="103" y="255" font-size="12" font-weight="700" text-anchor="end">0</text><rect class="cell" x="112" y="220" width="40" height="40" rx="6"/><rect class="s2" x="123.64" y="231.64" width="16.72" height="16.72" rx="1.76"/><text class="t" x="147" y="255" font-size="12" font-weight="700" text-anchor="end">1</text><rect class="cell" x="156" y="220" width="40" height="40" rx="6"/><rect class="s2" x="167.64" y="231.64" width="16.72" height="16.72" rx="1.76"/><text class="t" x="191" y="255" font-size="12" font-weight="700" text-anchor="end">1</text><text class="t" x="240" y="110" font-size="13" text-anchor="start" font-weight="600">Hits the board needs</text><rect class="s2" x="240" y="118" width="286" height="26" rx="5"/><text class="t" x="534" y="136" font-size="14" text-anchor="start" font-weight="700">11</text><text class="t" x="240" y="172" font-size="13" text-anchor="start" font-weight="600">Hits the pieces deliver (A3 + B4 + C3 + D4)</text><rect class="acc" x="240" y="180" width="364" height="26" rx="5"/><text class="t" x="612" y="198" font-size="14" text-anchor="start" font-weight="700">14</text><rect class="warnb" x="526" y="214" width="78" height="24" rx="5" stroke-width="1.5" stroke-dasharray="4 3"/><text class="t" x="565.0" y="231" font-size="12" text-anchor="middle" font-weight="600">spare 3</text><text class="m" x="240" y="266" font-size="13" text-anchor="start" font-weight="400">The spare must be a whole number of laps: 3 = 1 × 3. So exactly one square</text><text class="m" x="240" y="284" font-size="13" text-anchor="start" font-weight="400">gets hit 3 times and lands back where it started.</text><text class="m" x="240" y="314" font-size="13" text-anchor="start" font-weight="400">The search tracks this budget at every step. A branch that overspends,</text><text class="m" x="240" y="332" font-size="13" text-anchor="start" font-weight="400">or leaves a square that the remaining pieces can't reach enough times,</text><text class="m" x="240" y="350" font-size="13" text-anchor="start" font-weight="400">is cut immediately, long before the board fills up.</text></svg>
