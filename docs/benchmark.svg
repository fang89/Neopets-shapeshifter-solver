</style><rect class="bg" x="0.5" y="0.5" width="759" height="299" rx="14"/><text class="t" x="24" y="38" font-size="20" text-anchor="start" font-weight="700">Why race three solvers?</text><text class="m" x="24" y="62" font-size="13.5" text-anchor="start" font-weight="400">34 real boards from live play: how many each setup solved within the time limit (native build, Oct 2026)</text><text class="t" x="24" y="112" font-size="13" text-anchor="start" font-weight="400">Exhaustive search alone (30 s)</text><rect class="cell" x="270" y="96" width="408" height="22" rx="5"/><rect class="acc" x="270" y="96" width="192" height="22" rx="5"/><text class="t" x="690" y="112" font-size="13" text-anchor="start" font-weight="700">16 / 34</text><text class="t" x="24" y="160" font-size="13" text-anchor="start" font-weight="400">Annealing alone (30 s)</text><rect class="cell" x="270" y="144" width="408" height="22" rx="5"/><rect class="acc" x="270" y="144" width="156" height="22" rx="5"/><text class="t" x="690" y="160" font-size="13" text-anchor="start" font-weight="700">13 / 34</text><text class="t" x="24" y="208" font-size="13" text-anchor="start" font-weight="400">Both together (30 s)</text><rect class="cell" x="270" y="192" width="408" height="22" rx="5"/><rect class="acc" x="270" y="192" width="240" height="22" rx="5"/><text class="t" x="690" y="208" font-size="13" text-anchor="start" font-weight="700">20 / 34</text><text class="t" x="24" y="256" font-size="13" text-anchor="start" font-weight="400">+ belief-guided search (60 s)</text><rect class="cell" x="270" y="240" width="408" height="22" rx="5"/><rect class="ok" x="270" y="240" width="324" height="22" rx="5"/><text class="t" x="690" y="256" font-size="13" text-anchor="start" font-weight="700">27 / 34</text></svg>
