<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 430" width="940" height="430" role="img"><style>
 .bg{fill:#ffffff;stroke:#d0d7de} .t{fill:#1f2328;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif} .m{fill:#59636e;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
 .cell{fill:#f3f4f6;stroke:#d0d7de} .ln{stroke:#8c959f} .lnf{fill:#8c959f}
 .s0{fill:#2da44e} .s1{fill:#f59e0b} .s2{fill:#3b82f6}
 .hit{fill:#dbeafe;stroke:#3b82f6} .click{fill:none;stroke:#f97316}
 .box{fill:#f6f8fa;stroke:#d0d7de} .acc{fill:#8250df} .accs{stroke:#8250df}
 .ok{fill:#2da44e} .okb{fill:#dafbe1;stroke:#2da44e} .warnb{fill:#fff1e5;stroke:#f97316}
 .pc{fill:#8250df}
 @media (prefers-color-scheme: dark) {
  .bg{fill:#0d1117;stroke:#30363d} .t{fill:#e6edf3} .m{fill:#9198a1}
  .cell{fill:#161b22;stroke:#30363d} .ln{stroke:#6e7681} .lnf{fill:#6e7681}
  .hit{fill:#0c2d6b;stroke:#58a6ff} .box{fill:#161b22;stroke:#30363d}
  .okb{fill:#0f2e1b;stroke:#3fb950} .warnb{fill:#3a1d08;stroke:#f97316} .acc{fill:#a371f7} .accs{stroke:#a371f7} .pc{fill:#a371f7}
 }
</style><rect class="bg" x="0.5" y="0.5" width="939" height="429" rx="14"/><text class="t" x="24" y="38" font-size="20" text-anchor="start" font-weight="700">What runs where</text><text class="m" x="24" y="62" font-size="13.5" text-anchor="start" font-weight="400">Everything ships as one HTML file. The C solver is compiled to WebAssembly and embedded inside it.</text><rect class="box" x="24" y="84" width="560" height="322" rx="14"/><text class="t" x="44" y="112" font-size="15" text-anchor="start" font-weight="700">Solver tab</text><text class="m" x="132" y="112" font-size="12.5" text-anchor="start" font-weight="400">· the page you open</text><rect class="bg" x="44" y="126" width="520" height="62" rx="10"/><text class="t" x="62" y="152" font-size="14" text-anchor="start" font-weight="700">Page</text><text class="m" x="62" y="172" font-size="12.5" text-anchor="start" font-weight="400">HTML · CSS · plain JavaScript (no framework, no libraries)</text><text class="m" x="62" y="214" font-size="12.5" text-anchor="start" font-weight="400">starts 3 Web Workers, each running the same WebAssembly in a different role</text><rect class="bg" x="44" y="228" width="164" height="86" rx="10"/><rect class="acc" x="44" y="228" width="164" height="6" rx="3"/><text class="t" x="58" y="258" font-size="13.5" text-anchor="start" font-weight="700">Exhaustive</text><text class="t" x="58" y="276" font-size="13.5" text-anchor="start" font-weight="700">search</text><text class="m" x="58" y="300" font-size="12" text-anchor="start" font-weight="400">WebAssembly ← C</text><rect class="bg" x="220" y="228" width="164" height="86" rx="10"/><rect class="acc" x="220" y="228" width="164" height="6" rx="3"/><text class="t" x="234" y="258" font-size="13.5" text-anchor="start" font-weight="700">Belief-guided</text><text class="t" x="234" y="276" font-size="13.5" text-anchor="start" font-weight="700">search</text><text class="m" x="234" y="300" font-size="12" text-anchor="start" font-weight="400">WebAssembly ← C</text><rect class="bg" x="396" y="228" width="164" height="86" rx="10"/><rect class="acc" x="396" y="228" width="164" height="6" rx="3"/><text class="t" x="410" y="258" font-size="13.5" text-anchor="start" font-weight="700">Simulated</text><text class="t" x="410" y="276" font-size="13.5" text-anchor="start" font-weight="700">annealing</text><text class="m" x="410" y="300" font-size="12" text-anchor="start" font-weight="400">WebAssembly ← C</text><rect class="warnb" x="44" y="330" width="520" height="56" rx="10" stroke-width="1.2"/><text class="t" x="62" y="354" font-size="12.5" text-anchor="start" font-weight="600">solver.c  →  emcc -O3  →  .wasm  →  base64, inlined into the page</text><text class="m" x="62" y="373" font-size="12" text-anchor="start" font-weight="400">Built once, so the page needs no server, no install and no network for solving.</text><rect class="box" x="676" y="84" width="240" height="322" rx="14"/><text class="t" x="696" y="112" font-size="15" text-anchor="start" font-weight="700">Game tab</text><text class="m" x="774" y="112" font-size="12.5" text-anchor="start" font-weight="400">· neopets.com</text><rect class="bg" x="696" y="140" width="200" height="94" rx="10"/><text class="t" x="712" y="166" font-size="14" text-anchor="start" font-weight="700">Bookmarklet</text><text class="m" x="712" y="186" font-size="12.5" text-anchor="start" font-weight="400">plain JavaScript</text><text class="m" x="712" y="206" font-size="12" text-anchor="start" font-weight="400">reads the board, lights</text><text class="m" x="712" y="222" font-size="12" text-anchor="start" font-weight="400">up the next square</text><text class="m" x="696" y="272" font-size="12.5" text-anchor="start" font-weight="400">Only highlights squares.</text><text class="m" x="696" y="290" font-size="12.5" text-anchor="start" font-weight="400">Never clicks, never submits.</text><line class="ln" x1="694" y1="146" x2="572" y2="146" stroke-width="2"/><path class="lnf" d="M566 146 l9 -5 v10z"/><text class="m" x="630" y="138" font-size="12" text-anchor="middle" font-weight="400">board</text><line class="ln" x1="566" y1="172" x2="688" y2="172" stroke-width="2"/><path class="lnf" d="M694 172 l-9 -5 v10z"/><text class="m" x="630" y="190" font-size="12" text-anchor="middle" font-weight="400">answer</text><text class="m" x="630" y="206" font-size="11" text-anchor="middle" font-weight="400">postMessage</text></svg>
