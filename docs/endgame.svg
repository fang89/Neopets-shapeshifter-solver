</style><rect class="bg" x="0.5" y="0.5" width="899" height="359" rx="14"/><text class="t" x="24" y="38" font-size="20" text-anchor="start" font-weight="700">The trick that makes the search fast: an endgame table</text><text class="m" x="24" y="62" font-size="13.5" text-anchor="start" font-weight="400">Small pieces have the most possible spots, so the bottom of the search tree is by far its widest part.</text><rect class="warnb" x="112" y="210" width="436" height="92" rx="12" stroke-width="1.5" stroke-dasharray="5 4"/><circle class="acc" cx="330.0" cy="100" r="7"/><line class="ln" x1="330.0" y1="107" x2="300.0" y2="137" stroke-width="1"/><line class="ln" x1="330.0" y1="107" x2="330.0" y2="137" stroke-width="1"/><line class="ln" x1="330.0" y1="107" x2="360.0" y2="137" stroke-width="1"/><circle class="acc" cx="300.0" cy="144" r="7"/><circle class="acc" cx="330.0" cy="144" r="7"/><circle class="acc" cx="360.0" cy="144" r="7"/><line class="ln" x1="300.0" y1="151" x2="240.0" y2="181" stroke-width="1"/><line class="ln" x1="300.0" y1="151" x2="270.0" y2="181" stroke-width="1"/><line class="ln" x1="330.0" y1="151" x2="300.0" y2="181" stroke-width="1"/><line class="ln" x1="330.0" y1="151" x2="330.0" y2="181" stroke-width="1"/><line class="ln" x1="330.0" y1="151" x2="360.0" y2="181" stroke-width="1"/><line class="ln" x1="360.0" y1="151" x2="390.0" y2="181" stroke-width="1"/><line class="ln" x1="360.0" y1="151" x2="420.0" y2="181" stroke-width="1"/><circle class="acc" cx="240.0" cy="188" r="7"/><circle class="acc" cx="270.0" cy="188" r="7"/><circle class="acc" cx="300.0" cy="188" r="7"/><circle class="acc" cx="330.0" cy="188" r="7"/><circle class="acc" cx="360.0" cy="188" r="7"/><circle class="acc" cx="390.0" cy="188" r="7"/><circle class="acc" cx="420.0" cy="188" r="7"/><line class="ln" x1="240.0" y1="195" x2="150.0" y2="225" stroke-width="1"/><line class="ln" x1="240.0" y1="195" x2="180.0" y2="225" stroke-width="1"/><line class="ln" x1="270.0" y1="195" x2="210.0" y2="225" stroke-width="1"/><line class="ln" x1="300.0" y1="195" x2="240.0" y2="225" stroke-width="1"/><line class="ln" x1="300.0" y1="195" x2="270.0" y2="225" stroke-width="1"/><line class="ln" x1="300.0" y1="195" x2="300.0" y2="225" stroke-width="1"/><line class="ln" x1="330.0" y1="195" x2="330.0" y2="225" stroke-width="1"/><line class="ln" x1="360.0" y1="195" x2="360.0" y2="225" stroke-width="1"/><line class="ln" x1="360.0" y1="195" x2="390.0" y2="225" stroke-width="1"/><line class="ln" x1="360.0" y1="195" x2="420.0" y2="225" stroke-width="1"/><line class="ln" x1="390.0" y1="195" x2="450.0" y2="225" stroke-width="1"/><line class="ln" x1="420.0" y1="195" x2="480.0" y2="225" stroke-width="1"/><line class="ln" x1="420.0" y1="195" x2="510.0" y2="225" stroke-width="1"/><circle class="acc" cx="150.0" cy="232" r="7"/><circle class="acc" cx="180.0" cy="232" r="7"/><circle class="acc" cx="210.0" cy="232" r="7"/><circle class="acc" cx="240.0" cy="232" r="7"/><circle class="acc" cx="270.0" cy="232" r="7"/><circle class="acc" cx="300.0" cy="232" r="7"/><circle class="acc" cx="330.0" cy="232" r="7"/><circle class="acc" cx="360.0" cy="232" r="7"/><circle class="acc" cx="390.0" cy="232" r="7"/><circle class="acc" cx="420.0" cy="232" r="7"/><circle class="acc" cx="450.0" cy="232" r="7"/><circle class="acc" cx="480.0" cy="232" r="7"/><circle class="acc" cx="510.0" cy="232" r="7"/><text class="m" x="24" y="105" font-size="12" text-anchor="start" font-weight="400">big pieces</text><text class="m" x="24" y="149" font-size="12" text-anchor="start" font-weight="400">searched</text><text class="m" x="24" y="193" font-size="12" text-anchor="start" font-weight="400">one by one</text><text class="t" x="330" y="270" font-size="13" text-anchor="middle" font-weight="700">last few small pieces: millions of combinations</text><text class="m" x="330" y="288" font-size="12" text-anchor="middle" font-weight="400">replaced by a single lookup</text><line class="ln" x1="552" y1="256" x2="585" y2="256" stroke-width="2"/><path class="lnf" d="M592 256 l-9 -5 v10z"/><rect class="okb" x="596" y="116" width="280" height="196" rx="12" stroke-width="1.5"/><text class="t" x="616" y="146" font-size="14" text-anchor="start" font-weight="700">Built once, before the search:</text><text class="t" x="616" y="176" font-size="12.5" text-anchor="start" font-weight="600">board leftover</text><text class="t" x="756" y="176" font-size="12.5" text-anchor="start" font-weight="600">last pieces go at</text><text class="m" x="616" y="198" font-size="12.5" text-anchor="start" font-weight="400">0 1 2 0 · 1 0 …</text><text class="m" x="756" y="198" font-size="12.5" text-anchor="start" font-weight="400">C (2,0) · D (2,2)</text><text class="m" x="616" y="220" font-size="12.5" text-anchor="start" font-weight="400">2 0 0 1 · 0 2 …</text><text class="m" x="756" y="220" font-size="12.5" text-anchor="start" font-weight="400">C (0,1) · D (1,2)</text><text class="m" x="616" y="242" font-size="12.5" text-anchor="start" font-weight="400">…</text><text class="m" x="756" y="242" font-size="12.5" text-anchor="start" font-weight="400">…</text><text class="m" x="616" y="276" font-size="12.5" text-anchor="start" font-weight="400">One probe answers “can the last pieces</text><text class="m" x="616" y="294" font-size="12.5" text-anchor="start" font-weight="400">finish this board?” — and says how.</text></svg>
