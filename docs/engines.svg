<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 400" width="940" height="400" role="img"><style>
 .bg{fill:#ffffff;stroke:#d0d7de} .t{fill:#1f2328;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif} .m{fill:#59636e;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
 .cell{fill:#f3f4f6;stroke:#d0d7de} .ln{stroke:#8c959f} .lnf{fill:#8c959f}
 .s0{fill:#2da44e} .s1{fill:#f59e0b} .s2{fill:#3b82f6}
 .hit{fill:#dbeafe;stroke:#3b82f6} .click{fill:none;stroke:#f97316}
 .box{fill:#f6f8fa;stroke:#d0d7de} .acc{fill:#8250df} .accs{stroke:#8250df}
 .ok{fill:#2da44e} .okb{fill:#dafbe1;stroke:#2da44e} .warnb{fill:#fff1e5;stroke:#f97316}
 .pc{fill:#8250df}
 @media (prefers-color-scheme: dark) {
  .bg{fill:#0d1117;stroke:#30363d} .t{fill:#e6edf3} .m{fill:#9198a1}
  .cell{fill:#161b22;stroke:#30363d} .ln{stroke:#6e7681} .lnf{fill:#6e7681}
  .hit{fill:#0c2d6b;stroke:#58a6ff} .box{fill:#161b22;stroke:#30363d}
  .okb{fill:#0f2e1b;stroke:#3fb950} .warnb{fill:#3a1d08;stroke:#f97316} .acc{fill:#a371f7} .accs{stroke:#a371f7} .pc{fill:#a371f7}
 }
</style><rect class="bg" x="0.5" y="0.5" width="939" height="399" rx="14"/><text class="t" x="24" y="38" font-size="20" text-anchor="start" font-weight="700">Step 2 — three solvers race, the first answer wins</text><text class="m" x="24" y="62" font-size="13.5" text-anchor="start" font-weight="400">All three run at once in background workers on your computer. They fail on different boards, so together they solve far more.</text><rect class="box" x="24" y="166" width="120" height="76" rx="12"/><text class="t" x="84" y="200" font-size="14" text-anchor="middle" font-weight="700">Your board</text><text class="m" x="84" y="220" font-size="12" text-anchor="middle" font-weight="400">+ pieces</text><path class="ln" d="M144 204 C 180 204, 180 130, 214 130" fill="none" stroke-width="2"/><rect class="box" x="216" y="92" width="390" height="76" rx="12"/><rect class="acc" x="216" y="92" width="6" height="76" rx="3"/><text class="t" x="236" y="118" font-size="15" text-anchor="start" font-weight="700">Exhaustive search</text><text class="m" x="236" y="138" font-size="12.5" text-anchor="start" font-weight="400">Biggest pieces first, budget + reach checks,</text><text class="m" x="236" y="155" font-size="12.5" text-anchor="start" font-weight="400">endgame lookup table. Can also prove “no answer”.</text><path class="ln" d="M606 130 C 640 130, 640 204, 668 204" fill="none" stroke-width="2"/><path class="ln" d="M144 204 C 180 204, 180 230, 214 230" fill="none" stroke-width="2"/><rect class="box" x="216" y="192" width="390" height="76" rx="12"/><rect class="acc" x="216" y="192" width="6" height="76" rx="3"/><text class="t" x="236" y="218" font-size="15" text-anchor="start" font-weight="700">Belief-guided search</text><text class="m" x="236" y="238" font-size="12.5" text-anchor="start" font-weight="400">Reads where each piece probably went and</text><text class="m" x="236" y="255" font-size="12.5" text-anchor="start" font-weight="400">tries the likeliest layouts first. Best on 10×10+.</text><path class="ln" d="M606 230 C 640 230, 640 204, 668 204" fill="none" stroke-width="2"/><path class="ln" d="M144 204 C 180 204, 180 330, 214 330" fill="none" stroke-width="2"/><rect class="box" x="216" y="292" width="390" height="76" rx="12"/><rect class="acc" x="216" y="292" width="6" height="76" rx="3"/><text class="t" x="236" y="318" font-size="15" text-anchor="start" font-weight="700">Simulated annealing</text><text class="m" x="236" y="338" font-size="12.5" text-anchor="start" font-weight="400">Drops every piece somewhere, then keeps moving</text><text class="m" x="236" y="355" font-size="12.5" text-anchor="start" font-weight="400">one at a time toward fewer wrong squares.</text><path class="ln" d="M606 330 C 640 330, 640 204, 668 204" fill="none" stroke-width="2"/><path class="lnf" d="M676 204 l-9 -5 v10z"/><rect class="okb" x="678" y="160" width="110" height="88" rx="12" stroke-width="1.5"/><text class="t" x="733" y="196" font-size="14" text-anchor="middle" font-weight="700">First</text><text class="t" x="733" y="214" font-size="14" text-anchor="middle" font-weight="700">answer</text><text class="m" x="733" y="232" font-size="12" text-anchor="middle" font-weight="400">wins</text><line class="ln" x1="788" y1="204" x2="805" y2="204" stroke-width="2"/><path class="lnf" d="M812 204 l-9 -5 v10z"/><rect class="box" x="814" y="160" width="104" height="88" rx="12"/><text class="t" x="866" y="194" font-size="13" text-anchor="middle" font-weight="700">Replayed</text><text class="t" x="866" y="212" font-size="13" text-anchor="middle" font-weight="700">on a copy</text><text class="m" x="866" y="232" font-size="12" text-anchor="middle" font-weight="400">then shown</text></svg>
